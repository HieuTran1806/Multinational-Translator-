# Production. All values MUST come from the environment (no defaults for secrets).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration   # never loads demo data
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:false}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
logging:
  level:
    vn.edu.thuyetminh: INFO
