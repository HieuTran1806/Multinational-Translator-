# Local development. Loads demo POIs (db/demo) and attaches demo WAV tones.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # Demo seeds are numbered V100+, so a dev DB that already ran them would reject every new schema
    # migration (V4, V5, ...) as "out of order". Allow it here only; prod never loads db/demo.
    out-of-order: true
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging:
  level:
    vn.edu.thuyetminh: DEBUG
