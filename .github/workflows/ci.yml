name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-docs:
    name: Contract documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required baseline documents
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/README.md
          test -f docs/requirements/BRD.md
          test -f docs/requirements/Use_Case_Specification_Final_15_UC.md
          test -f docs/architecture/api.md
          test -f docs/architecture/phase-1-contract-baseline.md
          test -f docs/reports/current-state-inventory.md
          test -f docs/operations/ci-cd.md
          test -f services/backend/ARCHITECTURE.md
      - name: Check patch whitespace
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="HEAD^"
          else
            base="$PUSH_BEFORE"
          fi
          git diff --check "$base...HEAD"

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test
