# Local development stack for services present on this branch.
# From repository root, copy infra/.env.example to infra/.env and set a local password.
name: multitional-translator

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thuyetminh}
      POSTGRES_USER: ${POSTGRES_USER:-thuyetminh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thuyetminh}
      DB_USERNAME: ${POSTGRES_USER:-thuyetminh}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_AUTH_SESSION_TTL: ${APP_AUTH_SESSION_TTL:-8h}
      # UC02: page each access QR opens. Use the LAN IP (http://<IP>:5174/activate) to test with a real phone.
      APP_ACCESS_ACTIVATION_URL: ${APP_ACCESS_ACTIVATION_URL:-http://localhost:5174/activate}
      APP_STORAGE_LOCAL_ROOT: /app/data/media
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_ROLE: ${APP_BOOTSTRAP_ADMIN_ROLE:-SUPER_ADMIN}
      APP_TTS_PROVIDER: ${APP_TTS_PROVIDER:-none}
      APP_TTS_MAX_INPUT_BYTES: ${APP_TTS_MAX_INPUT_BYTES:-4500}
      APP_TTS_REQUEST_TIMEOUT: ${APP_TTS_REQUEST_TIMEOUT:-30s}
      APP_TTS_MAX_ATTEMPTS: ${APP_TTS_MAX_ATTEMPTS:-3}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - media:/app/data/media

volumes:
  pgdata:
  media:
