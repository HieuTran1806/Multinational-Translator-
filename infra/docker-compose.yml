# Local development stack: PostgreSQL + Spring Boot backend + React Admin (dev profile, demo data).
# Usage (from repo root):  cp infra/.env.example infra/.env  &&  docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
name: thuyet-minh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thuyetminh}
      POSTGRES_USER: ${POSTGRES_USER:-thuyetminh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../services/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thuyetminh}
      DB_USERNAME: ${POSTGRES_USER:-thuyetminh}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_TTS_PROVIDER: ${APP_TTS_PROVIDER:-none}
      # Only used when APP_TTS_PROVIDER=google: path INSIDE the container of the mounted key file
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS_IN_CONTAINER:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"   # exposed on LAN so a physical phone can reach it in dev
    volumes:
      - media:/app/data/media
      # Uncomment to use Google Cloud TTS (file stays outside the repo):
      # - ${GOOGLE_CREDENTIALS_FILE_ON_HOST}:/run/secrets/gcp-tts.json:ro

  admin:
    build:
      context: ../apps/admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:80"

volumes:
  pgdata:
  media:
